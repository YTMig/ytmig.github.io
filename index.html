<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZapZap · Chat de texto e voz</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:'Segoe UI', Arial, sans-serif; background:#d9d4c8;
    -webkit-user-select:none; user-select:none;
  }
  input, textarea { -webkit-user-select:text; user-select:text; }

  /* ===== TELA INICIAL ===== */
  #telaEntrada {
    position:fixed; inset:0; z-index:10; background:#0b141a;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .entradaBox {
    background:#111b21; color:#e9edef; border-radius:16px; padding:28px 24px;
    width:100%; max-width:380px; text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .entradaBox h1 { color:#25d366; font-size:26px; margin-bottom:4px; }
  .entradaBox .sub { color:#8696a0; font-size:13px; margin-bottom:18px; }
  .campo { width:100%; background:#2a3942; border:0; border-radius:10px;
           color:#e9edef; padding:12px 14px; font-size:15px; margin-bottom:10px; outline:none; }
  .campo::placeholder { color:#8696a0; }
  .btnVerde {
    width:100%; background:#00a884; color:#fff; border:0; border-radius:10px;
    padding:12px; font:bold 16px 'Segoe UI', Arial, sans-serif; cursor:pointer; margin-bottom:10px;
  }
  .btnVerde.secundario { background:#2a3942; color:#e9edef; }
  .btnVerde:active { filter:brightness(1.15); }
  .avisoErro { color:#f15c6d; font-size:13px; min-height:16px; margin-top:4px; }
  .dica { color:#8696a0; font-size:12px; margin-top:12px; line-height:1.5; }

  /* ===== SALA ===== */
  #sala { position:fixed; inset:0; display:flex; flex-direction:column; }
  .hidden { display:none !important; }

  .topo {
    background:#005e54; color:#fff; padding:10px 12px; display:flex;
    align-items:center; gap:10px; flex-shrink:0;
  }
  .topo .info { flex:1; min-width:0; }
  .topo .titulo { font:bold 16px 'Segoe UI', Arial, sans-serif; }
  .topo .status { font-size:12px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topoBtn {
    background:rgba(255,255,255,.15); border:0; color:#fff; border-radius:8px;
    padding:8px 10px; font-size:16px; cursor:pointer;
  }
  .topoBtn:disabled { opacity:.35; cursor:default; }
  .topoBtn.gravando { background:#f15c6d; }

  #mensagens {
    flex:1; overflow-y:auto; padding:14px 10px 6px 10px;
    background:#efeae2; -webkit-user-select:text; user-select:text;
  }
  .linha { display:flex; margin-bottom:8px; }
  .linha.eu { justify-content:flex-end; }
  .bolha {
    max-width:78%; background:#fff; border-radius:10px; padding:7px 10px 5px 10px;
    box-shadow:0 1px 1px rgba(0,0,0,.12); word-wrap:break-word;
  }
  .linha.eu .bolha { background:#d9fdd3; }
  .bolha .quem { color:#00a884; font:bold 12px 'Segoe UI', Arial, sans-serif; margin-bottom:2px; }
  .bolha .texto { font-size:15px; line-height:1.4; color:#111b21; white-space:pre-wrap; }
  .bolha .hora { font-size:10px; color:#667781; text-align:right; margin-top:2px; }
  .bolha.sistema { background:transparent; box-shadow:none; max-width:100%; }
  .bolha.sistema .texto { color:#667781; font-size:12px; text-align:center; background:#ffe9c7;
                          padding:5px 12px; border-radius:8px; }

  .barraInput {
    flex-shrink:0; background:#f0f2f5; padding:8px; display:flex; gap:8px; align-items:flex-end;
  }
  #txtMsg {
    flex:1; background:#fff; border:0; border-radius:20px; padding:11px 16px;
    font-size:15px; resize:none; max-height:110px; outline:none; font-family:inherit; line-height:1.4;
  }
  #btnEnviar {
    background:#00a884; border:0; color:#fff; border-radius:50%;
    width:46px; height:46px; font-size:19px; cursor:pointer; flex-shrink:0;
  }
  #btnEnviar:disabled { opacity:.4; }
</style>
</head>
<body>

<!-- TELA INICIAL -->
<div id="telaEntrada">
  <div class="entradaBox">
    <h1>⚡ ZapZap</h1>
    <div class="sub">Chat de texto e voz · entre com um código de sala</div>
    <input id="inNome" class="campo" maxlength="20" placeholder="Seu nome" autocomplete="off">
    <input id="inSala" class="campo" maxlength="6" placeholder="Código da sala (ex.: KP7X2)" autocomplete="off"
           autocapitalize="characters" style="text-transform:uppercase">
    <button id="btnCriar" class="btnVerde">Criar sala</button>
    <button id="btnEntrar" class="btnVerde secundario">Entrar na sala</button>
    <div id="avisoErro" class="avisoErro"></div>
    <div class="dica">Crie uma sala e mande o código para quem quiser conversar.
    Quem entra pela voz compartilha o microfone; texto vai para todos da sala.</div>
  </div>
</div>

<!-- SALA -->
<div id="sala" class="hidden">
  <div class="topo">
    <div class="info">
      <div class="titulo">Sala <span id="lblSala">—</span></div>
      <div class="status" id="lblStatus">conectando…</div>
    </div>
    <button id="btnVoz" class="topoBtn" title="Entrar na chamada de voz">🎙 Entrar na voz</button>
    <button id="btnMudo" class="topoBtn hidden" title="Silenciar microfone">🔇</button>
    <button id="btnCopiar" class="topoBtn" title="Copiar código da sala">📋</button>
    <button id="btnSair" class="topoBtn" title="Sair da sala">✖</button>
  </div>
  <div id="mensagens"></div>
  <div class="barraInput">
    <textarea id="txtMsg" rows="1" placeholder="Mensagem"></textarea>
    <button id="btnEnviar" title="Enviar">➤</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =========================================================
   ZapZap — chat de texto e voz (WebRTC via PeerJS)
   Salas: código curto. Quem cria a sala fica com o ID fixo
   "ytmigzap-<CÓDIGO>" e retransmite as mensagens para todos.
   ========================================================= */
var $ = function (id) { return document.getElementById(id); };
var PREFIXO = 'ytmigzap-';

/* ---------- estado ---------- */
var st = {
  peer: null,          // objeto PeerJS local
  meuId: '',           // meu peer id
  isHost: false,
  sala: '',
  nome: '',
  conns: [],           // (host) conexões de dados dos participantes
  hostConn: null,      // (cliente) conexão com o host
  roster: {},          // pid -> nome
  emVoz: false,
  mudo: false,
  meuStream: null,
  calls: {},           // pid -> MediaConnection (voz)
  audios: {}           // pid -> elemento <audio>
};

/* ---------- utilitários ---------- */
function gerarCodigo(){
  var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  var s = '';
  for (var i = 0; i < 5; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
  return s;
}
function horaAgora(){
  var d = new Date();
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function erro(msg){ $('avisoErro').textContent = msg; }
function scrollToFim(){ var m = $('mensagens'); m.scrollTop = m.scrollHeight; }

/* ---------- mensagens na tela ---------- */
function bolhaSistema(texto){
  var l = document.createElement('div'); l.className = 'linha';
  var b = document.createElement('div'); b.className = 'bolha sistema';
  var t = document.createElement('div'); t.className = 'texto'; t.textContent = texto;
  b.appendChild(t); l.appendChild(b); $('mensagens').appendChild(l); scrollToFim();
}
function bolhaMsg(quem, texto, minha){
  var l = document.createElement('div'); l.className = 'linha' + (minha ? ' eu' : '');
  var b = document.createElement('div'); b.className = 'bolha';
  if (!minha && quem){
    var q = document.createElement('div'); q.className = 'quem'; q.textContent = quem; b.appendChild(q);
  }
  var t = document.createElement('div'); t.className = 'texto'; t.textContent = texto;
  var h = document.createElement('div'); h.className = 'hora'; h.textContent = horaAgora();
  b.appendChild(t); b.appendChild(h); l.appendChild(b); $('mensagens').appendChild(l); scrollToFim();
}
function atualizarStatus(){
  var n = 1 + Object.keys(st.roster).length;
  var voz = 0;
  for (var pid in st.roster) if (st.roster[pid].emVoz) voz++;
  if (st.emVoz) voz++;
  $('lblStatus').textContent = (st.isHost ? 'host · ' : '') + 'online · ' + n +
    (n === 1 ? ' pessoa' : ' pessoas') + (voz ? ' · ' + voz + ' na voz' : '');
}

/* =========================================================
   ENVIO / RETRANSMISSÃO
   ========================================================= */
function enviarTodos(dado, excetoConn){
  var s = JSON.stringify(dado);
  if (st.isHost){
    for (var i = 0; i < st.conns.length; i++)
      if (st.conns[i] !== excetoConn && st.conns[i].open) st.conns[i].send(s);
  } else if (st.hostConn && st.hostConn.open){
    st.hostConn.send(s);
  }
}
function enviar(dado){ if (st.isHost) enviarTodos(dado, null); else enviarTodos(dado); }

/* =========================================================
   ENTRADA NA SALA
   ========================================================= */
function limparPeer(){
  try { if (st.peer) st.peer.destroy(); } catch (e) {}
  st.peer = null;
}
function abrirSala(codigo, anfitriao){
  st.sala = codigo;
  st.isHost = anfitriao;
  $('lblSala').textContent = codigo;
  $('telaEntrada').classList.add('hidden');
  $('sala').classList.remove('hidden');
  bolhaSistema(anfitriao
    ? 'Sala criada! Código: ' + codigo + ' — mande para quem quiser conversar.'
    : 'Você entrou na sala ' + codigo + '.');
  atualizarStatus();
  localStorage.setItem('zapzap_nome', st.nome);
}
function iniciarVozSePronto(){
  if (st.emVoz && st.meuStream) chamarTodosEmVoz();
}

/* HOST: fica com o ID fixo da sala */
function tentarAnfitriao(codigo){
  erro('');
  var p = new Peer(PREFIXO + codigo);
  st.peer = p;
  p.on('open', function (id){
    st.meuId = id;
    st.roster = {};
    abrirSala(codigo, true);
    atualizarStatus();
  });
  p.on('connection', function (conn){ prepararConnHost(conn); });
  p.on('call', function (call){ atenderVoz(call); });
  p.on('error', function (err){
    if (err && err.type === 'unavailable-id'){
      /* código já em uso → entra como participante */
      limparPeer();
      entrarComoCliente(codigo);
    } else {
      mostrarErroRede(err);
    }
  });
  p.on('disconnected', function (){ try { p.reconnect(); } catch (e) {} });
}

/* CLIENTE: entra na sala de alguém */
function entrarComoCliente(codigo){
  var p = new Peer();
  st.peer = p;
  p.on('open', function (id){
    st.meuId = id;
    var conn = p.connect(PREFIXO + codigo, { reliable: true });
    st.hostConn = conn;
    conn.on('open', function (){
      abrirSala(codigo, false);
      enviar({ tipo: 'hello', nome: st.nome, pid: st.meuId });
    });
    conn.on('data', receberDados);
    conn.on('close', function (){
      if ($('sala').classList.contains('hidden')) return;
      desligarVozLocal();
      st.roster = {};
      bolhaSistema('A sala foi encerrada pelo anfitrião.');
      $('lblStatus').textContent = 'sala encerrada';
    });
    p.on('call', function (call){ atenderVoz(call); });
  });
  p.on('error', function (err){
    if (err && err.type === 'peer-unavailable') erro('Sala ' + codigo + ' não encontrada. Confira o código.');
    else mostrarErroRede(err);
  });
  p.on('disconnected', function (){ try { p.reconnect(); } catch (e) {} });
}

function mostrarErroRede(err){
  console.error('peer error', err && err.type, err);
  var map = { network: 'Sem conexão com a internet.', server: 'Servidor de sinal fora do ar. Tente de novo.', browser: 'Seu navegador não suporta WebRTC.' };
  if ($('sala').classList.contains('hidden')) erro((map[err && err.type]) || 'Erro de conexão. Tente de novo.');
  else $('lblStatus').textContent = 'sem conexão…';
}

/* HOST: recebe conexão de um participante */
function prepararConnHost(conn){
  st.conns.push(conn);
  conn.on('data', function (bruto){
    var d;
    try { d = JSON.parse(bruto); } catch (e) { return; }
    if (d.tipo === 'hello'){
      conn.pidParticipante = d.pid;
      st.roster[d.pid] = { nome: d.nome, emVoz: false };
      bolhaSistema(d.nome + ' entrou na sala.');
      difundirRoster();
      enviarTodos(d, conn);
      iniciarVozSePronto(); /* host em voz chama o novo */
    } else if (d.tipo === 'msg'){
      bolhaMsg(d.nome, d.texto, false);
      enviarTodos(d, conn);
    } else if (d.tipo === 'voz-on'){
      if (st.roster[d.pid]) st.roster[d.pid].emVoz = true;
      bolhaSistema((st.roster[d.pid] || { nome: 'Alguém' }).nome + ' entrou na voz.');
      difundirRoster();
      enviarTodos(d, conn);
      iniciarVozSePronto();
    } else if (d.tipo === 'voz-off'){
      if (st.roster[d.pid]){
        bolhaSistema(st.roster[d.pid].nome + ' saiu da voz.');
        st.roster[d.pid].emVoz = false;
      }
      difundirRoster();
      enviarTodos(d, conn);
      encerrarVozCom(d.pid);
    } else {
      enviarTodos(d, conn); /* retransmite o resto */
    }
  });
  conn.on('close', function (){
    var i = st.conns.indexOf(conn);
    if (i >= 0) st.conns.splice(i, 1);
    var pid = conn.pidParticipante;
    if (pid && st.roster[pid]){
      bolhaSistema(st.roster[pid].nome + ' saiu da sala.');
      if (st.roster[pid].emVoz) encerrarVozCom(pid);
      delete st.roster[pid];
      difundirRoster();
    }
    atualizarStatus();
  });
}

/* HOST: avisa a lista de presença para todos */
function difundirRoster(){
  var lista = [];
  if (st.isHost) lista.push({ pid: st.meuId, nome: st.nome + ' (anfitrião)', emVoz: st.emVoz });
  for (var pid in st.roster) lista.push({ pid: pid, nome: st.roster[pid].nome });
  enviar({ tipo: 'roster', lista: lista });
  atualizarStatus();
}

/* CLIENTE + HOST: processa dados recebidos */
function receberDados(bruto){
  var d;
  try { d = JSON.parse(bruto); } catch (e) { return; }
  if (d.tipo === 'msg'){
    bolhaMsg(d.nome, d.texto, false);
  } else if (d.tipo === 'roster'){
    st.roster = {};
    for (var i = 0; i < d.lista.length; i++){
      if (d.lista[i].pid !== st.meuId) st.roster[d.lista[i].pid] = { nome: d.lista[i].nome, emVoz: !!d.lista[i].emVoz };
    }
    atualizarStatus();
    iniciarVozSePronto();
  } else if (d.tipo === 'hello'){
    if (!st.roster[d.pid]) st.roster[d.pid] = { nome: d.nome, emVoz: false };
    atualizarStatus();
    bolhaSistema(d.nome + ' entrou na sala.');
    iniciarVozSePronto();
  } else if (d.tipo === 'voz-on'){
    if (!st.roster[d.pid]) st.roster[d.pid] = { nome: d.nome, emVoz: false };
    st.roster[d.pid].emVoz = true;
    atualizarStatus();
    bolhaSistema(d.nome + ' entrou na voz.');
    iniciarVozSePronto();
  } else if (d.tipo === 'voz-off'){
    if (st.roster[d.pid]) st.roster[d.pid].emVoz = false;
    atualizarStatus();
    bolhaSistema(d.nome + ' saiu da voz.');
    encerrarVozCom(d.pid);
  } else if (d.tipo === 'saiu'){
    if (st.roster[d.pid]) delete st.roster[d.pid];
    atualizarStatus();
    bolhaSistema(d.nome + ' saiu da sala.');
  }
}

/* =========================================================
   VOZ (malha completa: quem está na voz chama quem entra)
   ========================================================= */
function chamarTodosEmVoz(){
  if (!st.emVoz || !st.meuStream) return;
  for (var pid in st.roster){
    if (!st.roster[pid].emVoz || st.calls[pid] || pid === st.meuId) continue;
    /* só quem tem o id "menor" liga: evita os dois ligarem um para o outro ao mesmo tempo */
    if (st.meuId < pid) chamar(pid);
  }
}
function chamar(pid){
  if (!st.meuStream || st.calls[pid]) return;
  var call = st.peer.call(pid, st.meuStream);
  registrarCall(pid, call);
}
function atenderVoz(call){
  registrarCall(call.peer, call);
  call.answer(st.meuStream); /* sem stream = ouvir apenas */
}
function registrarCall(pid, call){
  st.calls[pid] = call;
  call.on('stream', function (remoto){
    if (!st.audios[pid]){
      var a = document.createElement('audio');
      a.autoplay = true;
      a.srcObject = remoto;
      document.body.appendChild(a);
      st.audios[pid] = a;
      var play = a.play && a.play();
      if (play && play.catch) play.catch(function (){ /* autoplay bloqueado: usuário precisa tocar */ });
    }
  });
  call.on('close', function (){ encerrarVozCom(pid); });
}
function encerrarVozCom(pid){
  var call = st.calls[pid];
  if (call){ try { call.close(); } catch (e) {} delete st.calls[pid]; }
  if (st.audios[pid]){ try { st.audios[pid].srcObject = null; st.audios[pid].remove(); } catch (e) {} delete st.audios[pid]; }
}
function desligarVozLocal(){
  st.emVoz = false; st.mudo = false;
  $('btnVoz').textContent = '🎙 Entrar na voz';
  $('btnMudo').classList.add('hidden');
  $('btnMudo').textContent = '🔇';
  for (var pid in st.calls) encerrarVozCom(pid);
  if (st.meuStream){
    var trs = st.meuStream.getTracks();
    for (var i = 0; i < trs.length; i++) try { trs[i].stop(); } catch (e) {}
    st.meuStream = null;
  }
}
function sairDaVoz(){
  desligarVozLocal();
  enviar({ tipo: 'voz-off', nome: st.nome, pid: st.meuId });
  if (st.isHost) difundirRoster();
  bolhaSistema('Você saiu da voz.');
}
function entrarNaVoz(){
  if (st.emVoz) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    bolhaSistema('Seu navegador não permite microfone. Use Chrome, Edge, Firefox ou Safari atualizados.');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
    .then(function (stream){
      st.meuStream = stream;
      st.emVoz = true;
      $('btnVoz').textContent = '🎙 Na voz · toque para sair';
      $('btnMudo').classList.remove('hidden');
      enviar({ tipo: 'voz-on', nome: st.nome, pid: st.meuId });
      if (st.isHost) difundirRoster();
      chamarTodosEmVoz();
    })
    .catch(function (){
      bolhaSistema('Não consegui acessar o microfone. Autorize o acesso e tente de novo.');
    });
}
function alternarMudo(){
  if (!st.emVoz || !st.meuStream) return;
  st.mudo = !st.mudo;
  var trs = st.meuStream.getAudioTracks();
  for (var i = 0; i < trs.length; i++) trs[i].enabled = !st.mudo;
  $('btnMudo').textContent = st.mudo ? '🎙' : '🔇';
}

/* =========================================================
   INTERFACE
   ========================================================= */
function enviarTexto(){
  var t = $('txtMsg').value.replace(/^\s+|\s+$/g, '');
  if (!t) return;
  $('txtMsg').value = '';
  bolhaMsg(st.nome, t, true);
  enviar({ tipo: 'msg', nome: st.nome, texto: t });
}

function comecar(anfitriao){
  var nome = $('inNome').value.replace(/^\s+|\s+$/g, '');
  var codigo = $('inSala').value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  if (!nome){ erro('Digite seu nome.'); $('inNome').focus(); return; }
  if (!anfitriao && codigo.length < 4){ erro('Digite o código da sala (4+ caracteres).'); $('inSala').focus(); return; }
  st.nome = nome;
  if (anfitriao){
    var novo = codigo.length >= 4 ? codigo : gerarCodigo();
    tentarAnfitriao(novo);
    erro('');
    $('btnCriar').disabled = true; $('btnEntrar').disabled = true;
    setTimeout(function (){ $('btnCriar').disabled = false; $('btnEntrar').disabled = false; }, 2500);
  } else {
    entrarComoCliente(codigo);
    $('btnCriar').disabled = true; $('btnEntrar').disabled = true;
    setTimeout(function (){ $('btnCriar').disabled = false; $('btnEntrar').disabled = false; }, 2500);
  }
}

/* ---------- ligações da interface ---------- */
$('btnCriar').onclick = function (){ comecar(true); };
$('btnEntrar').onclick = function (){ comecar(false); };
$('btnEnviar').onclick = enviarTexto;
$('btnVoz').onclick = function (){
  if (!st.emVoz) entrarNaVoz();
  else sairDaVoz();
};
$('btnMudo').onclick = alternarMudo;
$('btnCopiar').onclick = function (){
  var texto = 'Entre no ZapZap: ' + location.origin + location.pathname + '?sala=' + st.sala;
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(texto).then(function (){ $('btnCopiar').textContent = '✅'; setTimeout(function (){ $('btnCopiar').textContent = '📋'; }, 1200); },
      function (){ $('btnCopiar').textContent = st.sala; });
  else $('btnCopiar').textContent = st.sala;
};
$('btnSair').onclick = function (){
  try { enviar({ tipo: 'saiu', nome: st.nome }); } catch (e) {}
  desligarVozLocal();
  limparPeer();
  st.conns = []; st.hostConn = null; st.roster = {};
  $('mensagens').innerHTML = '';
  $('sala').classList.add('hidden');
  $('telaEntrada').classList.remove('hidden');
};
$('inSala').addEventListener('keydown', function (e){ if (e.key === 'Enter') comecar(false); });
$('inNome').addEventListener('keydown', function (e){ if (e.key === 'Enter') $('inSala').focus(); });
$('txtMsg').addEventListener('keydown', function (e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviarTexto(); }
});
window.addEventListener('beforeunload', function (){
  try { enviar({ tipo: 'saiu', nome: st.nome }); desligarVozLocal(); limparPeer(); } catch (e) {}
});

/* ---------- inicialização ---------- */
try { var salvo = localStorage.getItem('zapzap_nome'); if (salvo) $('inNome').value = salvo; } catch (e) {}
(function (){
  var m = location.search.match(/[?&]sala=([A-Za-z0-9]{3,8})/);
  if (m){ $('inSala').value = m[1].toUpperCase(); $('inNome').focus(); }
  else $('inNome').focus();
})();
</script>
</body>
</html>
